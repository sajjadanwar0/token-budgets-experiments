[package]
name = "fair-baseline"
version = "0.1.0"
edition = "2024"
description = "Fair-baseline replay: compare Token Budgets (pre-call) vs equivalent runtime callback (post-call) on the same Anthropic workload"

# Standalone workspace; do not inherit a parent crate.
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
