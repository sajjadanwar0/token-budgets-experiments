[package]
name = "conjecture_1_stress"
version = "0.1.0"
edition = "2021"
authors = ["Sajjad Khan <sajjad@skilltechsolutions.uk>"]
description = "Adversarial stress test for Token Budgets' safety-preservation invariant (Lemma 2)"

[dependencies]
tokio = { version = "1.35", features = ["full", "macros", "rt-multi-thread", "time", "sync"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
panic-injection = []

[profile.release]
debug = true
opt-level = 3
lto = "thin"

[[bin]]
name = "stress"
path = "src/main.rs"
